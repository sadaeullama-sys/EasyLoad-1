name: Build EasyLoad Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform and configure Kotlin
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml
          grep -q '^name: easyload_shop_manager$' pubspec.yaml
          flutter create --project-name easyload_shop_manager . --platforms=android --org com.ilyas.easyload

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />\n'
          if 'android.permission.CAMERA' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission
              )
          manifest.write_text(text)

          settings = Path('android/settings.gradle')
          if not settings.exists():
              raise SystemExit('android/settings.gradle was not generated')
          text = settings.read_text()
          pattern = r"""(id\s+["']org\.jetbrains\.kotlin\.android["']\s+version\s+["'])[^"']+(["']\s+apply\s+false)"""
          text, count = re.subn(pattern, r'\g<1>1.9.24\g<2>', text)
          if count == 0:
              raise SystemExit('Could not find Kotlin Android plugin declaration in android/settings.gradle')
          settings.write_text(text)
          print('Configured org.jetbrains.kotlin.android 1.9.24')
          PY
          rm -rf test

      - name: Verify Android Kotlin plugin
        run: grep -n 'org.jetbrains.kotlin.android' android/settings.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoad-Shop-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
