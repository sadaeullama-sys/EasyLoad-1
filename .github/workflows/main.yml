name: Build EasyLoad Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Verify project and create Android platform files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $PWD"
          test -f pubspec.yaml || { echo "ERROR: pubspec.yaml is not in repository root"; exit 1; }
          grep -n '^name:' pubspec.yaml
          flutter create --project-name easyload_shop_manager . --platforms=android --org com.ilyas.easyload
          # flutter create adds a default widget_test.dart that expects MyApp.
          # This project entry point is EasyLoadApp, so remove the unused scaffold test.
          rm -rf test
          grep -n '^name:' pubspec.yaml
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EasyLoad-Shop-Manager-APK
          path: build/app/outputs/flutter-apk/app-release.apk
